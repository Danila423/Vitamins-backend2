input {
  gelf {
    port => 12201
  }
}

filter {
  if [message] {
    json {
      source => "message"
      target => "app"
      skip_on_invalid_json => true
    }
  }

  if ![app] and [short_message] {
    json {
      source => "short_message"
      target => "app"
      skip_on_invalid_json => true
    }
  }

  if [app] {
    if [app][timestamp] {
      date {
        match => ["[app][timestamp]", "ISO8601"]
        target => "@timestamp"
      }
    }

    mutate {
      copy => {
        "[app][msg]" => "message"
        "[app][operation]" => "[operation]"
        "[app][channel]" => "[channel]"
        "[app][request_id]" => "[request][id]"
        "[app][trace_id]" => "[trace][id]"
        "[app][span_id]" => "[span][id]"
        "[app][duration_ms]" => "[event][duration_ms]"
        "[app][error]" => "[error][message]"
        "[app][error_code]" => "[error][code]"
        "[app][service.name]" => "[service][name]"
        "[app][service.version]" => "[service][version]"
        "[app][env]" => "[service][environment]"
        "[app][http.method]" => "[http][request][method]"
        "[app][http.status_code]" => "[http][response][status_code]"
        "[app][http.path]" => "[url][path]"
        "[app][http.route]" => "[url][route]"
        "[app][user_id]" => "[user][id]"
      }
    }

    if ![log][level] and [app][level] {
      mutate { add_field => { "[log][level]" => "%{[app][level]}" } }
    }
  }

  if ![message] and [short_message] {
    mutate { add_field => { "message" => "%{short_message}" } }
  }

  if ![service][name] {
    mutate { add_field => { "[service][name]" => "vitamins-backend" } }
  }
  if ![service][environment] {
    mutate { add_field => { "[service][environment]" => "local" } }
  }
  if ![channel] {
    mutate { add_field => { "channel" => "app" } }
  }

  mutate {
    lowercase => ["[log][level]", "[channel]", "[service][environment]"]
  }

  ruby {
    code => '
      banned = %w[
        password pass token access_token refresh_token authorization otp code verification_code
        smtp_pass smtp_user cookie set-cookie session secret smtp_credentials
      ]
      scrub = lambda do |obj|
        case obj
        when Hash
          obj.keys.each do |k|
            key = k.to_s.downcase
            if banned.include?(key)
              obj.delete(k)
            else
              obj[k] = scrub.call(obj[k])
            end
          end
        when Array
          obj.map! { |v| scrub.call(v) }
        end
        obj
      end
      event.to_hash.keys.each do |k|
        next if k.start_with?("@")
        val = event.get(k)
        event.set(k, scrub.call(val))
      end
    '
  }

  if [event][duration_ms] {
    ruby {
      code => '
        ms = event.get("[event][duration_ms]")
        if ms
          event.set("[event][duration]", ms.to_i * 1000000)
        end
      '
    }
  }

  mutate {
    remove_field => ["app", "short_message", "full_message", "host", "version", "command"]
    add_field => { "[event][dataset]" => "%{[service][name]}.%{[channel]}" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "vitamins-logs-%{[service][name]}-%{[service][environment]}-%{+YYYY.MM.dd}"
    ilm_enabled => false
    data_stream => false
  }
  stdout {
    codec => rubydebug { metadata => false }
  }
}
