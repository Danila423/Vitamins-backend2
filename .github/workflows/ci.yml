name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ──────────────── 1. LINT ────────────────
  lint:
    name: Lint & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod verify
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62
          only-new-issues: ${{ github.event_name == 'pull_request' }}
          args: --timeout=5m

      - name: testifylint
        run: |
          go install github.com/Antonboom/testifylint@v1.6.4
          testifylint ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ──────────────── 2. UNIT ────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.0

      - name: Run unit tests
        run: |
          gotestsum \
            --format pkgname \
            --junitfile unit-report.xml \
            -- -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-report
          path: |
            unit-report.xml
            coverage.out

  # ──────────────── 3. INTEGRATION ────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vitamins
          POSTGRES_PASSWORD: vitamins
          POSTGRES_DB: vitamins_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://vitamins:vitamins@localhost:5432/vitamins_test?sslmode=disable
      REDIS_ADDR: localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.0

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U vitamins; do
            echo "waiting for postgres..."
            sleep 2
          done

      - name: Run integration tests
        run: |
          gotestsum \
            --format pkgname \
            --junitfile integration-report.xml \
            -- -tags=integration -count=1 -p 1 ./...

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-report
          path: integration-report.xml

  # ──────────────── 4. E2E ────────────────
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: integration

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vitamins
          POSTGRES_PASSWORD: vitamins
          POSTGRES_DB: vitamins_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://vitamins:vitamins@localhost:5432/vitamins_test?sslmode=disable
      REDIS_ADDR: localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.0

      - name: Run E2E tests
        run: |
          gotestsum \
            --format pkgname \
            --junitfile e2e-report.xml \
            -- -tags=e2e -count=1 -p 1 ./test/e2e

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: e2e-report.xml

  # ──────────────── 5. DOCKER BUILD ────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: vitamins-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
