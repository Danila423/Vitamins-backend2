services:
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - postgres-exporter
      - redis-exporter
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  grafana:
    image: grafana/grafana:11.1.4
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://vitamins:vitamins@db:5432/vitamins?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - db

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=basic
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "12201:12201/udp"
      - "9600:9600"
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - logstash_data:/usr/share/logstash/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/_node/pipelines > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    volumes:
      - ./elk/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20

  elk-setup:
    image: curlimages/curl:8.7.1
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./elk/elasticsearch/ilm/logs-ilm-policy.json:/setup/logs-ilm-policy.json:ro
      - ./elk/elasticsearch/templates/logs-template.json:/setup/logs-template.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      set -e;
      curl -fsS -X PUT http://elasticsearch:9200/_ilm/policy/logs-hot-delete-14d -H "Content-Type: application/json" --data-binary @/setup/logs-ilm-policy.json;
      curl -fsS -X PUT http://elasticsearch:9200/_index_template/logs-template-v1 -H "Content-Type: application/json" --data-binary @/setup/logs-template.json;
    restart: "no"

  kibana-setup:
    image: curlimages/curl:8.7.1
    depends_on:
      kibana:
        condition: service_healthy
    volumes:
      - ./elk/kibana/setup.sh:/setup/setup.sh:ro
    entrypoint: ["/bin/sh", "/setup/setup.sh"]
    restart: "no"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vitamins
      POSTGRES_PASSWORD: vitamins
      POSTGRES_DB: vitamins
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./pkg/db/models.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./pkg/db/seed_vitamin_catalog.sql:/docker-entrypoint-initdb.d/002_seed_catalog.sql:ro

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    depends_on: [db, redis, logstash]
    env_file:
      - .env
    environment:
      HTTP_PORT: "8080"
      REDIS_ADDR: "redis:6379"
    ports:
      - "8080:8080"
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:12201"
        tag: "vitamins-api"
        labels: "com.docker.compose.service,com.docker.compose.project"

  db-seed:
    image: postgres:16
    depends_on: [db]
    environment:
      PGPASSWORD: vitamins
    volumes:
      - ./pkg/db/seed_vitamin_catalog.sql:/seed/seed_vitamin_catalog.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command: >
      until pg_isready -h db -U vitamins -d vitamins; do sleep 1; done;
      until psql -h db -U vitamins -d vitamins -c "select 1 from vitamin_catalog limit 1" >/dev/null 2>&1; do sleep 1; done;
      psql -h db -U vitamins -d vitamins -f /seed/seed_vitamin_catalog.sql
    restart: "no"

volumes:
  db_data:
  es_data:
  logstash_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
