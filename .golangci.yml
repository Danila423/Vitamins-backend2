version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - bodyclose
    - noctx
    - unconvert
    - nolintlint
    - revive

  settings:
    gosec:
      excludes:
        - G104
    errcheck:
      check-type-assertions: true
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

  exclusions:
    paths:
      - internal/auth/mocks
      - internal/analytics/mocks
      - internal/vitamins/mocks
      - internal/db
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - noctx
      - path: _test\.go
        text: "unused-parameter"
        linters:
          - revive
      - path: "internal/auth/auth\\.go"
        text: "stutters"
        linters:
          - revive
      - linters:
          - staticcheck
        text: "QF1008"

formatters:
  enable:
    - gofmt
    - goimports
