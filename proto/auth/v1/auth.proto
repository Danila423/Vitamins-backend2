syntax = "proto3";

package auth.v1;

option go_package = "vitamins-backend_2/gen/go/auth/v1;authv1";

service AuthService {
  rpc Register(RegisterRequest) returns (TokenPairResponse);
  rpc Login(LoginRequest) returns (TokenPairResponse);
  rpc Refresh(RefreshRequest) returns (TokenPairResponse);

  rpc GetProfile(GetProfileRequest) returns (UserProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UserProfileResponse);

  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (Empty);
  rpc VerifyPasswordResetCode(VerifyPasswordResetCodeRequest) returns (VerifyCodeResponse);
  rpc ConfirmPasswordReset(ConfirmPasswordResetRequest) returns (Empty);

  rpc RequestPasswordChange(RequestPasswordChangeRequest) returns (Empty);
  rpc VerifyPasswordChangeCode(VerifyPasswordChangeCodeRequest) returns (VerifyCodeResponse);
  rpc ConfirmPasswordChange(ConfirmPasswordChangeRequest) returns (Empty);
}

message Empty {}

message RegisterRequest {
  string email = 1;
  string password = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message RefreshRequest {
  string refresh_token = 1;
}

message TokenPairResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message GetProfileRequest {
  int64 user_id = 1;
}

message UpdateProfileRequest {
  int64 user_id = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional string email = 4;
}

message UserProfileResponse {
  int64 id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
}

message RequestPasswordResetRequest {
  string email = 1;
}

message VerifyPasswordResetCodeRequest {
  string email = 1;
  string code = 2;
}

message VerifyCodeResponse {
  string token = 1;
}

message ConfirmPasswordResetRequest {
  string reset_token = 1;
  string password = 2;
  string password_confirm = 3;
}

message RequestPasswordChangeRequest {
  int64 user_id = 1;
}

message VerifyPasswordChangeCodeRequest {
  int64 user_id = 1;
  string code = 2;
}

message ConfirmPasswordChangeRequest {
  string change_token = 1;
  string password = 2;
  string password_confirm = 3;
}
